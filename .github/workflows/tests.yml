name: tests

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        # uses: actions/checkout@v4
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          tools: composer:v2
          coverage: xdebug

      - name: Setup Node
        # uses: actions/setup-node@v4
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      # added to prevent "file not found" error that caused the tests to fail
      - name: Create SQLite database file
        run: touch database/database.sqlite

      - name: Install Node Dependencies
        run: npm ci

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      # The following step is what "npm run build" ultimately chokes on.
      # When run as a separate step, it results in an HttpException.
      # "Users do not have an associated email address"
      # That made me suspect that DB migrations and seeders need to run before doing npm run build,
      # but that didn't help.
      - name: Wayfinder (all by itself)
        run: php artisan wayfinder:generate --with-form

      # moving this lower in the flow
#      - name: Build Assets
#        run: npm run build

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      # add migrate and seed step before npm run build
      - name: Migrate and Seed DB
        run: php artisan migrate --seed
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
      
      # moved below database seeding
      - name: Build Assets
        run: npm run build

      - name: Tests
        run: ./vendor/bin/pest
        # override local test settings for Github actions
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
