; Supervisor program for managing Laravel's job queue worker.
;
; Fill in the placeholders below (<APP_PATH>, <PHP_BIN>, <WWW_USER>) for
; each environment (QA, live), then:
;   sudo cp laravel-worker.conf /etc/supervisor/conf.d/laravel-worker.conf
;   sudo supervisorctl reread
;   sudo supervisorctl update
;   sudo supervisorctl start laravel-worker
;
; If you edit this file again after initial set up and start, 
; repeat the last three supervisorctl commands to reload and 
; restart the process.
;
[program:laravel-worker]
command=<PHP_BIN> artisan queue:work
directory=<APP_PATH>
autostart=true
autorestart=true
user=<WWW_USER>
numprocs=1
; On stop, Supervisor sends TERM and the worker finishes its current job before exiting.
; The deploy script stops the worker before migrating and relies on that, so give it
; longer than the worker's job timeout (queue:work default --timeout=60) before
; Supervisor gives up and kills it mid-job. If you add --timeout to the command above,
; keep this larger than it.
stopwaitsecs=70
redirect_stderr=true
stdout_logfile=<APP_PATH>/storage/logs/worker.log
