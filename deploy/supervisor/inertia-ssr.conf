; Supervisor program definition for the Inertia SSR (Node) process.
;
; `php artisan inertia:start-ssr` does NOT daemonize itself: it spawns the
; Node process (bootstrap/ssr/ssr.js, built via `npm run build:ssr`) via
; Symfony Process, then blocks in the foreground forwarding its
; stdout/stderr, and forwards SIGINT/SIGQUIT/SIGTERM to the Node child via
; pcntl. That's exactly what Supervisor wants — do not raise numprocs above
; 1. The command also calls `inertia:stop-ssr` internally before starting,
; which shuts down whatever is currently listening on the configured SSR
; port over HTTP; a second concurrent instance would stop the first one out
; from under Supervisor's tracking and cause restart flapping.
;
; Requires the `pcntl` extension on the PHP CLI binary for graceful
; shutdown — confirm with `php -m | grep pcntl` before relying on this.
;
; Deploy ordering: `npm run build:ssr` must complete (producing a fresh
; bootstrap/ssr/ssr.js) BEFORE this program is (re)started, or it'll pick up
; a stale/missing bundle. Restart it as the last deploy step, e.g.:
;   supervisorctl restart inertia-ssr
;
; --- Node version ---
; Build/deploy runs as ec2-user via an nvm-managed node; this program runs
; as apache, which resolves node via the system-wide dnf install at
; /usr/bin/node. dnf's version has been deliberately updated to match
; ec2-user's nvm default, so --runtime=/usr/bin/node below is safe to use
; directly — no per-user path, no permission workarounds needed.
;
; This alignment is a manual convention, not an enforced one: if ec2-user's
; nvm default drifts from dnf's system node again (nvm upgrade, dnf
; upgrade, etc.), the build and runtime versions silently diverge again.
; Re-check with:
;   sudo -u ec2-user bash -lc 'node -v'   vs.   /usr/bin/node -v
;
; Fill in the remaining placeholders below (<APP_PATH>, <PHP_BIN>, <NODE_BIN>, <WWW_USER>) for
; each environment (QA, live), then:
;   sudo cp inertia-ssr.conf /etc/supervisor/conf.d/inertia-ssr.conf
;   sudo supervisorctl reread
;   sudo supervisorctl update
;   sudo supervisorctl start inertia-ssr

[program:inertia-ssr]
command=/usr/bin/php artisan inertia:start-ssr --no-ansi --runtime=/usr/bin/node
directory=<APP_PATH>
user=<WWW_USER>
numprocs=1
autostart=true
autorestart=true
startretries=5
startsecs=3
stopsignal=TERM
stopwaitsecs=10
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/inertia-ssr.out.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile=/var/log/supervisor/inertia-ssr.err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5
; --runtime=/usr/bin/node above makes node resolution explicit, so this
; PATH is just a sane baseline for anything else the process might shell
; out to.
environment=PATH="/usr/local/bin:/usr/bin:/bin"
